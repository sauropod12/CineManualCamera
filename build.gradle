plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.cinemanualcamera'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.cinemanualcamera'
        minSdk 29
        targetSdk 29
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
